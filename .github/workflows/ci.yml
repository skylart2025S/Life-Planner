name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: planner_ci_only
          POSTGRES_DB: life_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d life_planner_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PLAN_TEST_DATABASE_URL: postgresql://planner:planner_ci_only@localhost:5432/life_planner_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run planning, authentication, API and PostgreSQL tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check browser JavaScript and wardrobe behavior
        run: |
          node --check apps/web/app.js
          node --check apps/web/calendar-domain.js
          node --check apps/web/wardrobe.js
          node --check apps/web/wardrobe-domain.js
          node --test tests/web/*.test.js
      - name: Run synthetic planning demo
        run: python -m life_planner.demo
      - name: Build local review context
        run: python scripts/review_context.py
