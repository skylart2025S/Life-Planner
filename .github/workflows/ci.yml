name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run planning behavior tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic planning demo
        run: python -m life_planner.demo
      - name: Build local review context
        run: python scripts/review_context.py
